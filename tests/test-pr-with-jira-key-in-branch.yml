name: Test PR with Jira key in branch name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature/ABC-456-implement-new-feature
      GITHUB_BASE_REF: main
      GITHUB_REF: refs/pull/1/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-github-token
          jira-username: user@example.com
          jira-token: fake-jira-api-token
          jira-base-url: https://test-domain.atlassian.net
          jira-project-key: ABC
          add-label-with-issue-type: "true"
          issue-type-label-color: "FBCA04"
          issue-type-label-description: "Jira Issue Type"
          add-jira-key-to-title: "true"
          add-issue-type-emoji-to-title: "true"
          add-jira-key-to-body: "true"
          add-jira-fix-versions-to-body: "true"

      - name: Assert action attempted to run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a definitive outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
