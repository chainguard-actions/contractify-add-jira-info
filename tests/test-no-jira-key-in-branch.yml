name: Test - No Jira key in branch name
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (branch has no Jira key - should warn and exit gracefully)
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          jira-username: test-user
          jira-token: fake-jira-token
          jira-base-url: https://example.atlassian.net
          jira-project-key: PROJ
          add-label-with-issue-type: "false"
          add-jira-key-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"
        continue-on-error: true

      - name: Assert action completed without hard failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should succeed (exit 0) because it exits gracefully when
          # no Jira key is found in the branch name 'act-harness'
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully with no Jira key in branch"
          else
            echo "FAIL: expected success outcome but got: $OUTCOME"
            exit 1
          fi
