name: Test - No Jira key in branch name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (branch has no Jira key pattern)
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          jira-base-url: "https://example.atlassian.net"
          jira-username: "test@example.com"
          jira-token: "fake-jira-token"
          jira-project-key: "PROJ"
          add-label-with-issue-type: "false"
          add-jira-key-to-title: "false"
          add-issue-type-emoji-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"
        # The branch 'act-harness' contains no PROJ-NNN pattern,
        # so the action should warn and exit gracefully (exit 0)

      - name: Assert action completed without failure
        run: |
          echo "Action completed successfully - no Jira key found in branch, as expected"
          echo "PASS"
