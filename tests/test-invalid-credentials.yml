name: Test invalid Jira credentials error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid Jira credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          jira-username: fake-user@example.com
          jira-token: fake-token-invalid
          jira-base-url: https://fake-domain-that-does-not-exist-xyz123.atlassian.net
          jira-project-key: FAKE
          add-label-with-issue-type: "false"
          add-jira-key-to-title: "false"
          add-issue-type-emoji-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"

      - name: Assert action completed (exits early — no Jira key in branch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, the branch is 'act-harness' which does not match the
          # Jira key pattern 'FAKE-NNN'. The action exits early with a warning
          # ("No Jira key found in branch name") and returns success — it never
          # reaches the Jira API call, so invalid credentials don't cause failure.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly (no Jira key in branch name)"
          else
            echo "FAIL: expected success (early exit) but got outcome='$OUTCOME'"
            exit 1
          fi
