name: Test action fails gracefully with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: feature/PROJ-456-some-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: invalid-token
          jira-username: invalid-user@example.com
          jira-token: invalid-jira-token
          jira-base-url: https://invalid-nonexistent-domain.atlassian.net
          jira-project-key: PROJ
          add-label-with-issue-type: "true"
          issue-type-label-color: "FF0000"
          issue-type-label-description: "Test Issue Type"
          add-jira-key-to-title: "true"
          add-issue-type-emoji-to-title: "true"
          add-jira-key-to-body: "true"
          add-jira-fix-versions-to-body: "true"

      - name: Assert action failed gracefully (not a crash/setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With invalid credentials and a non-existent Jira domain, the action
          # should fail (not succeed). We verify it ran and produced a failure
          # outcome rather than crashing the runner itself.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
