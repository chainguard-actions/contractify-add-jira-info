name: Test with jira-username input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature/TEST-123-my-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          jira-username: test-user@example.com
          jira-token: fake-jira-token
          jira-base-url: https://fake-domain.atlassian.net
          jira-project-key: TEST
          add-label-with-issue-type: "false"
          add-jira-key-to-title: "false"
          add-issue-type-emoji-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"
      - name: Assert action ran (may fail due to fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with fake Jira credentials,
          # but it must have been invoked (not skipped), confirming jira-username input is accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with jira-username input (outcome: $OUTCOME)"
