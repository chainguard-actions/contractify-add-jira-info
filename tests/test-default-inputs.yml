name: Test action with default optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with only required inputs (defaults for optional ones)
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          jira-username: test-user@example.com
          jira-token: invalid-token-for-testing
          jira-base-url: https://nonexistent-test-domain-zzz999.atlassian.net
          jira-project-key: TESTKEY
          # add-label-with-issue-type defaults to "true"
          # issue-type-label-color defaults to "FBCA04"
          # issue-type-label-description defaults to "Jira Issue Type"
          # add-jira-key-to-title defaults to "true"
          # add-issue-type-emoji-to-title defaults to "true"
          # add-jira-key-to-body defaults to "true"
          # add-jira-fix-versions-to-body defaults to "true"

      - name: Assert action ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The branch under act is 'act-harness' which contains no Jira key pattern.
          # The action exits early with a warning and returns success.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with default inputs and exited cleanly (no Jira key in branch)"
          else
            echo "FAIL: expected success but got outcome='$OUTCOME'"
            exit 1
          fi
