name: Test - Custom label configuration
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom label color and description
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          jira-username: test-user
          jira-token: fake-jira-token
          jira-base-url: https://example.atlassian.net
          jira-project-key: PROJ
          add-label-with-issue-type: "true"
          issue-type-label-color: "FF0000"
          issue-type-label-description: "Custom Jira Issue Type Label"
          add-jira-key-to-title: "false"
          add-issue-type-emoji-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"
        continue-on-error: true

      - name: Assert action accepted custom label config and exited gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should parse custom label inputs and exit gracefully
          # since no Jira key (PROJ-NNN) is found in branch name 'act-harness'
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted custom label config and exited gracefully"
          else
            echo "FAIL: expected success outcome but got: $OUTCOME"
            exit 1
          fi
