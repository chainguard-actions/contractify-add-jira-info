name: Test project key lookup with unreachable Jira
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          jira-username: test-user
          jira-token: test-jira-token
          jira-base-url: http://127.0.0.1:1
      - name: Assert action handled Jira failure gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when project key lookup fails"
            exit 1
          fi
          echo "PASS"
