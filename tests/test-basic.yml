name: Test basic usage - required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature/TEST-123-my-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          jira-token: fake-jira-token
          jira-base-url: https://example.atlassian.net
          jira-project-key: TEST
          add-label-with-issue-type: "false"
          add-jira-key-to-title: "false"
          add-issue-type-emoji-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"
      - name: Assert action ran (may fail due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (not error due to missing inputs)
          # With fake credentials it will fail at the API call stage, which is expected
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
