name: Test - Multiple project keys provided
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with multiple project keys (none match branch name)
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          jira-username: test-user
          jira-token: fake-jira-token
          jira-base-url: https://example.atlassian.net
          jira-project-key: |-
            PROJ
            MYAPP
            BACKEND
          add-label-with-issue-type: "false"
          add-jira-key-to-title: "false"
          add-issue-type-emoji-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"
        continue-on-error: true

      - name: Assert action handled multiple project keys gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With multiple project keys (PROJ, MYAPP, BACKEND) and branch name
          # 'act-harness', none of the patterns match, so the action warns and
          # exits gracefully (exit 0)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action handled multiple project keys and exited gracefully"
          else
            echo "FAIL: expected success outcome but got: $OUTCOME"
            exit 1
          fi
