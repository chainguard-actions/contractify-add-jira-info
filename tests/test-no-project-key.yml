name: Test without explicit jira-project-key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/10/merge
      GITHUB_HEAD_REF: bugfix/ABC-789-fix-bug
      GITHUB_BASE_REF: develop
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          jira-token: fake-jira-api-token
          jira-base-url: https://example.atlassian.net
          # jira-project-key intentionally omitted (defaults to "")
          add-label-with-issue-type: "false"
          add-jira-key-to-title: "false"
          add-issue-type-emoji-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"
      - name: Assert action ran without crashing on missing project key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Without a project key the action will attempt to discover keys via Jira API.
          # With fake credentials it will fail at the API call, which is expected.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced a valid outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' - action may have crashed"
            exit 1
          fi
