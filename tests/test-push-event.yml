name: Test push event (non-PR context)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-github-token
          jira-username: fake-user@example.com
          jira-token: fake-jira-token
          jira-base-url: https://fake-domain.atlassian.net
          jira-project-key: PROJ

      - name: Assert action completed (success or failure, not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — expected success or failure"
            exit 1
          fi
