name: Test basic PR scenario with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature/PROJ-123-my-feature
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-github-token
          jira-username: fake-user@example.com
          jira-token: fake-jira-token
          jira-base-url: https://fake-domain.atlassian.net
          jira-project-key: PROJ
          add-label-with-issue-type: "false"
          add-jira-key-to-title: "false"
          add-issue-type-emoji-to-title: "false"
          add-jira-key-to-body: "false"
          add-jira-fix-versions-to-body: "false"

      - name: Assert action ran and failed gracefully (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail due to invalid credentials, not crash with an unhandled error
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (expected failure due to invalid credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
